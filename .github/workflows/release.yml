name: Build Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Tag must look like v1.2.3 (got ${GITHUB_REF_NAME})" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Patch addon version
        run: |
          sed -i -E "s/^## Version: .*/## Version: ${VERSION}/" LeatrixPlusExt.toc
          grep -n "^## Version:" LeatrixPlusExt.toc

      - name: Build addon
        run: node .github/scripts/build-release.js

      - name: Package
        run: |
          cd dist
          # dist 下只有一个插件文件夹，解压后直接放进 Interface/AddOns
          zip -r "../LeatrixPlusExt-${VERSION}.zip" */

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="LeatrixPlusExt-${VERSION}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Commit version bump
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- LeatrixPlusExt.toc; then
            echo "Version already matches ${VERSION}."
            exit 0
          fi

          git add LeatrixPlusExt.toc
          git commit -m "Bump version to ${VERSION}"

          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
